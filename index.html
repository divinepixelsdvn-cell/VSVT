function lsGet(key, def) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch { return def; }
}
function lsSet(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
}

async function sharedGet(key) {
  try {
    if (typeof window !== "undefined" && window.storage && typeof window.storage.get === "function") {
      const res = await window.storage.get(key, true);
      return res ? JSON.parse(res.value) : null;
    }
    return null;
  } catch { return null; }
}

async function sharedSet(key, val) {
  try {
    if (typeof window !== "undefined" && window.storage && typeof window.storage.set === "function") {
      await window.storage.set(key, JSON.stringify(val), true);
    }
  } catch {}
}

function fbAvailable() {
  return typeof window !== "undefined" && !!window.__fbDb;
}
async function fbGet(key) {
  try {
    const snap = await window.__fbDb.ref(key).once("value");
    return snap.exists() ? snap.val() : null;
  } catch { return null; }
}
async function fbSet(key, val) {
  try { await window.__fbDb.ref(key).set(val); } catch {}
}
function fbListen(key, cb) {
  if (!fbAvailable()) return () => {};
  const ref = window.__fbDb.ref(key);
  const handler = (snap) => cb(snap.exists() ? snap.val() : null);
  ref.on("value", handler);
  return () => ref.off("value", handler);
}

async function cloudGet(key) {
  const s = await sharedGet(key);
  if (s) return s;
  if (fbAvailable()) return fbGet(key);
  return null;
}
async function cloudSet(key, val) {
  await sharedSet(key, val);
  if (fbAvailable()) await fbSet(key, val);
}

const SHEET_SCHEMAS = {
  Donors: ["id", "icon", "name", "wifeName", "childrenNames", "relation", "village", "area", "details", "photo"],
  Events: ["id", "icon", "title", "date", "desc"],
  Info: ["id", "icon", "title", "value"],
  Donations: ["id", "icon", "title", "value", "desc"],
  Users: ["phone", "name", "password", "role", "photo"],
  Posts: ["id", "author", "date", "content", "likes", "commentsCount", "comments", "shares"],
};
async function postItemsToSheet(sheetWebAppUrl, sheetName, items) {
  if (!sheetWebAppUrl) return false;
  try {
    const schema = SHEET_SCHEMAS[sheetName] || Object.keys(items[0] || {});
    const rows = (items || []).map(it => {
      const row = {};
      schema.forEach(k => { row[k] = (it[k] !== undefined && it[k] !== null) ? it[k] : ""; });
      return row;
    });
    const res = await fetch(sheetWebAppUrl, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ sheet: sheetName, items: rows }),
    });
    const json = await res.json();
    return !!(json && json.ok);
  } catch { return false; }
}
async function fetchAllFromSheet(sheetWebAppUrl) {
  if (!sheetWebAppUrl) return null;
  try {
    const sep = sheetWebAppUrl.includes("?") ? "&" : "?";
    const res = await fetch(sheetWebAppUrl + sep + "action=getAll");
    const json = await res.json();
    return (json && json.ok) ? json.data : null;
  } catch { return null; }
}
function normalizeSheetRows(rows, schema) {
  if (!Array.isArray(rows)) return [];
  return rows
    .map(r => {
      const obj = {};
      schema.forEach(k => { obj[k] = (r && r[k] !== undefined && r[k] !== null) ? String(r[k]) : ""; });
      return obj;
    })
    .filter(obj => schema.some(k => obj[k] !== ""));
}

function getTodayStr() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

  // Google Sheet లో నేరుగా చేసిన మార్పులను కూడా యాప్‌లోకి తీసుకొచ్చే పోలింగ్ (ప్రతి 25 సెకన్లకు)
  useEffect(() => {
    if (!sheetWebAppUrl) return;
    let stopped = false;

    const applyListIfChanged = (schema, incomingRaw, lsKey, cloudKey, setter) => {
      const incoming = normalizeSheetRows(incomingRaw, schema);
      setter(prev => {
        const norm = (arr) => JSON.stringify(
          arr.map(o => schema.reduce((a, k) => { a[k] = (o[k] !== undefined && o[k] !== null) ? String(o[k]) : ""; return a; }, {}))
             .sort((a, b) => String(a.id || "").localeCompare(String(b.id || "")))
        );
        if (norm(prev) === norm(incoming)) return prev;
        lsSet(lsKey, incoming);
        cloudSet(cloudKey, incoming);
        return incoming;
      });
    };

    // యూజర్ల పేరు, పాస్‌వర్డ్, రోల్ షీట్ నుంచి తీసుకుని, పర్మిషన్స్ (అవి షీట్‌లో ఉండవు) మాత్రం యాప్‌లో ఇప్పటికే ఉన్నవాటినే కాపాడతాం.
    const applyUsersIfChanged = (incomingRaw) => {
      const incoming = normalizeSheetRows(incomingRaw, SHEET_SCHEMAS.Users);
      setUsers(prev => {
        const merged = incoming.map(row => {
          const existing = prev.find(u => u.phone === row.phone);
          return existing
            ? { ...existing, name: row.name || existing.name, password: row.password || existing.password, role: row.role || existing.role }
            : { name: row.name, phone: row.phone, role: row.role || "user", password: row.password || "", permissions: undefined };
        });
        const norm = (arr) => JSON.stringify(arr.map(u => ({ name: u.name, phone: u.phone, password: u.password, role: u.role })).sort((a, b) => a.phone.localeCompare(b.phone)));
        if (norm(prev) === norm(merged)) return prev;
        lsSet("vt_users", merged);
        cloudSet(STORAGE_KEYS.users, merged);
        return merged;
      });
    };

    const poll = async () => {
      const data = await fetchAllFromSheet(sheetWebAppUrl);
      if (!data || stopped) return;
      if (data.Donors) applyListIfChanged(SHEET_SCHEMAS.Donors, data.Donors, "vt_donors", STORAGE_KEYS.donors, setDonors);
      if (data.Events) applyListIfChanged(SHEET_SCHEMAS.Events, data.Events, "vt_events", STORAGE_KEYS.events, setEvents);
      if (data.Info) applyListIfChanged(SHEET_SCHEMAS.Info, data.Info, "vt_info", STORAGE_KEYS.info, setInfoItems);
      if (data.Donations) applyListIfChanged(SHEET_SCHEMAS.Donations, data.Donations, "vt_donations", STORAGE_KEYS.donations, setDonationItems);
      if (data.Users) applyUsersIfChanged(data.Users);
      setSheetSyncMsg("✅ షీట్‌తో సింక్ అయింది — " + new Date().toLocaleTimeString("te-IN"));
    };
    poll();
    const iv = setInterval(poll, 25000);
    return () => { stopped = true; clearInterval(iv); };
  }, [sheetWebAppUrl]);

  useEffect(() => {
    const t = setInterval(() => setDays(getDayCount()), 60000);
    return () => clearInterval(t);
  }, []);

  useEffect(() => {
    const handler = (e) => {
      if (menuRef.current && !menuRef.current.contains(e.target)) setMenuOpen(false);
    };
    if (menuOpen) document.addEventListener("mousedown", handler);
    return () => document.removeEventListener("mousedown", handler);
  }, [menuOpen]);

  const isMainAdmin = currentUser?.role === "main_admin";
  const isSubAdmin = currentUser?.role === "sub_admin";
  const hasPerm = (category, action) => {
    if (isMainAdmin) return true;
    if (isSubAdmin) return !!currentUser?.permissions?.[category]?.[action];
    return false;
  };

  const handleRegPhotoFile = (file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const dataUrl = e.target.result;
      setAuthForm(prev => ({ ...prev, photo: dataUrl, photoUploading: !!driveWebAppUrl }));
      if (driveWebAppUrl) {
        uploadToDrive(dataUrl, file.name).then(async (result) => {
          let finalUrl = dataUrl;
          if (result) {
            const candidateUrl = result.directUrl || result.previewUrl;
            const ok = await verifyImageUrl(candidateUrl);
            finalUrl = ok ? candidateUrl : dataUrl;
          }
          setAuthForm(prev => (prev.photo === dataUrl ? { ...prev, photo: finalUrl, photoUploading: false } : prev));
        });
      }
    };
    reader.readAsDataURL(file);
  };

  const handleProfilePhotoFile = (file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const dataUrl = e.target.result;
      setProfileForm(prev => ({ ...prev, photo: dataUrl, photoUploading: !!driveWebAppUrl }));
      if (driveWebAppUrl) {
        uploadToDrive(dataUrl, file.name).then(async (result) => {
          let finalUrl = dataUrl;
          if (result) {
            const candidateUrl = result.directUrl || result.previewUrl;
            const ok = await verifyImageUrl(candidateUrl);
            finalUrl = ok ? candidateUrl : dataUrl;
          }
          setProfileForm(prev => (prev.photo === dataUrl ? { ...prev, photo: finalUrl, photoUploading: false } : prev));
        });
      }
    };
    reader.readAsDataURL(file);
  };

  const openProfileEdit = () => {
    setProfileForm({ name: currentUser?.name || "", photo: currentUser?.photo || "", photoUploading: false });
    setProfileModal(true);
    setMenuOpen(false);
  };

  const handleSaveProfile = () => {
    if (!profileForm.name.trim()) { alert("పేరు నమోదు చేయండి"); return; }
    if (profileForm.photoUploading) { alert("ఫోటో అప్‌లోడ్ అవుతోంది, కొద్ది క్షణాలు వేచి ఉండండి..."); return; }
    const updatedUser = { ...currentUser, name: profileForm.name.trim(), photo: profileForm.photo || null };
    setCurrentUser(updatedUser);
    setUsers(users.map(u => u.phone === currentUser.phone ? { ...u, name: updatedUser.name, photo: updatedUser.photo } : u));
    setProfileModal(false);
  };

  const handleRegister = () => {
    setAuthError("");
    if (!authForm.name.trim()) { setAuthError("పేరు నమోదు చేయండి"); return; }
    if (!/^\d{10}$/.test(authForm.phone)) { setAuthError("10 అంకెల ఫోన్ నెంబర్ నమోదు చేయండి"); return; }
    if (!authForm.password || authForm.password.length < 4 || authForm.password.length > 8) { setAuthError("పాస్వర్డ్ 4-8 అక్షరాలు ఉండాలి"); return; }
    if (authForm.photoUploading) { setAuthError("ఫోటో అప్‌లోడ్ అవుతోంది, కొద్ది క్షణాలు వేచి ఉండండి..."); return; }
    if (users.find(u => u.phone === authForm.phone)) { setAuthError("ఈ నెంబర్ ఇప్పటికే నమోదు అయింది"); return; }
    const isDesignated = subAdmins.find(a => a.phone === authForm.phone);
    const role = isDesignated ? "sub_admin" : "user";
    const newUser = { name: authForm.name, phone: authForm.phone, password: authForm.password, photo: authForm.photo || null, role, permissions: isDesignated ? isDesignated.permissions : undefined };
    setUsers([...users, newUser]);
    setCurrentUser(newUser);
    setScreen("main");
    setAuthForm({ name: "", phone: "", password: "", photo: "", photoUploading: false });
  };

  const handleLogin = () => {
    setAuthError("");
    const foundMain = MAIN_ADMINS.find(a => a.id === authForm.phone && a.pwd === authForm.password);
    if (foundMain) {
      const u = { name: "మెయిన్ అడ్మిన్", phone: foundMain.id, role: "main_admin" };
      setCurrentUser(u); setScreen("main"); return;
    }
    const found = users.find(u => u.phone === authForm.phone && u.password === authForm.password);
    if (found) {
      const isDesignated = subAdmins.find(a => a.phone === found.phone);
      setCurrentUser({ ...found, role: isDesignated ? "sub_admin" : found.role, permissions: isDesignated ? isDesignated.permissions : found.permissions });
      setScreen("main");
      setAuthForm({ name: "", phone: "", password: "" });
    } else {
      setAuthError("ఫోన్ నెంబర్ లేదా పాస్వర్డ్ సరికాదు");
    }
  };

  // పాస్వర్డ్ మర్చిపోయిన యూజర్లు, వారి పేరు + ఫోన్ నెంబర్ సరిపోతేనే కొత్త పాస్వర్డ్ పెట్టుకోగలరు (మెయిన్ అడ్మిన్ పాస్వర్డ్ ఇక్కడ మారదు)
  const handleResetPassword = () => {
    setResetMsg("");
    const phone = resetForm.phone.trim();
    const name = resetForm.name.trim();
    if (!name) { setResetMsg("నమోదు చేసిన పూర్తి పేరు రాయండి"); return; }
    if (!/^\d{10}$/.test(phone)) { setResetMsg("10 అంకెల ఫోన్ నెంబర్ నమోదు చేయండి"); return; }
    if (!resetForm.newPassword || resetForm.newPassword.length < 4 || resetForm.newPassword.length > 8) { setResetMsg("కొత్త పాస్వర్డ్ 4-8 అక్షరాలు ఉండాలి"); return; }
    if (MAIN_ADMINS.find(a => a.id === phone)) { setResetMsg("మెయిన్ అడ్మిన్ పాస్వర్డ్ ఇక్కడ మార్చలేరు — దయచేసి డెవలపర్‌ని సంప్రదించండి"); return; }
    const existing = users.find(u => u.phone === phone);
    if (!existing || existing.name.trim().toLowerCase() !== name.toLowerCase()) { setResetMsg("ఈ పేరు మరియు ఫోన్ నెంబర్‌తో ఖాతా కనబడలేదు"); return; }
    setUsers(users.map(u => u.phone === phone ? { ...u, password: resetForm.newPassword } : u));
    setSubAdmins(subAdmins.map(a => a.phone === phone ? { ...a, password: resetForm.newPassword } : a));
    setResetMsg("✅ పాస్వర్డ్ మార్చబడింది! ఇప్పుడు కొత్త పాస్వర్డ్‌తో లాగిన్ అవ్వండి.");
    setResetForm({ name: "", phone: "", newPassword: "" });
  };

  const handleLogout = () => {

  const syncToShared = async (updatedPosts) => {

    const sheetRows = updatedPosts.map(p => ({

      content: p.content,
      likes: p.likes,

      shares: p.shares || 0,
    }));
    postItemsToSheet(sheetWebAppUrl, "Posts", sheetRows);
    setSyncStatus("✅ అందరికీ కనిపించేలా సింక్ అయింది!");
    setTimeout(() => setSyncStatus(""), 2500);
  };

  const handleLike = (id) => {

  const handleDeletePost = (id) => {

  const handleAddPost = async () => {
    if (!newPost.content.trim()) return;
    if (editingPostId && !hasPerm("feed", "edit")) return;
    if (!editingPostId && !hasPerm("feed", "add")) return;

    // Drive అప్‌లోడ్ ఇంకా పూర్తి కాకపోయినా పోస్ట్ వెంటనే ఫీడ్‌లో కనిపించేలా —
    // అప్‌లోడ్ ఇంకా జరుగుతూ ఉంటే దాని Promise ని పట్టుకుని, పూర్తయ్యాక ఆ పోస్టుని అప్డేట్ చేస్తాం.
    const pendingUpload = newPost.uploading ? uploadPromiseRef.current : null;
    const localImage = newPost.imageBase64 || null;
    const localType = newPost.imageBase64 ? (newPost.mediaType || "image") : "text";

    let updated;
    let targetId = editingPostId;
    if (editingPostId) {
      updated = posts.map(p => p.id === editingPostId
        ? { ...p, content: newPost.content, image: localImage || p.image, type: localImage ? localType : p.type, uploading: !!pendingUpload }
        : p);
    } else {
      targetId = Date.now();
      const p = {
        id: targetId,
        author: currentUser?.name || "అతిథి",
        avatar: isMainAdmin ? "👑" : isSubAdmin ? "✍️" : "👤",
        date: new Date().toISOString().slice(0, 10),
        type: localType,
        content: newPost.content,
        image: localImage,
        likes: 0,
        comments: [],
        liked: false,
        shares: 0,
        blogLink: null,
        uploading: !!pendingUpload
      };
      updated = [p, ...posts];
    }
    setPosts(updated);
    setNewPost({ content: "", imageBase64: "", imagePreview: "", mediaType: "", uploading: false });
    setEditingPostId(null);
    setPostModal(false);
    await syncToShared(updated);

    // పోస్ట్‌లో పెట్టిన ప్రతి ఫోటో/వీడియో "మీడియా" సెక్షన్‌లో కూడా "ఫీడ్ పోస్టులు" ఫోల్డర్‌లో కనిపించేలా కాపీ చేస్తాం.
    if (localImage) {
      const galleryId = "feed_" + targetId;
      setGallery(prev => {
        const exists = prev.some(g => g.id === galleryId);
        if (exists) return prev.map(g => g.id === galleryId ? { ...g, url: localImage, type: localType } : g);
        return [{ id: galleryId, url: localImage, type: localType, folder: "ఫీడ్ పోస్టులు" }, ...prev];
      });
    }

    if (pendingUpload) {
      uploadPromiseRef.current = null;
      pendingUpload.then(finalUrl => {
        setPosts(prev => {
          const next = prev.map(pp => pp.id === targetId ? { ...pp, image: finalUrl || pp.image, uploading: false } : pp);
          syncToShared(next);
          return next;
        });
        if (finalUrl) {
          const galleryId = "feed_" + targetId;
          setGallery(prev => prev.map(g => g.id === galleryId ? { ...g, url: finalUrl } : g));
        }
      });
    }
  };

  const handleEditPost = (post) => {
    setEditingPostId(post.id);
    uploadPromiseRef.current = null;
    setNewPost({ content: post.content, imageBase64: "", imagePreview: post.image || "", mediaType: post.type === "video" ? "video" : "image", uploading: false });
    setPostModal(true);
  };

  // ఒక పోస్ట్ కి WhatsApp లో పంపే మెసేజ్ టెక్స్ట్ + డీప్-లింక్ తయారు చేస్తుంది (ఎప్పుడూ "మెయిన్ అడ్మిన్" పేరుతోనే కనిపిస్తుంది)
  const buildShareMessage = (post) => {
    const kindLabel = post.type === "video" ? "వీడియో" : post.type === "image" ? "ఫోటో" : "అప్‌డేట్";
    const link = `${window.location.origin}${window.location.pathname}?post=${post.id}`;
    const text = `🛕 ${TEMPLE_NAME_LINE1}\n👑 మెయిన్ అడ్మిన్ కొత్త ${kindLabel} పోస్ట్ చేశారు:\n\n"${post.content}"\n\n👉 పూర్తిగా చూడటానికి: ${link}`;
    return { text, link };
  };

  // పోస్ట్ చేసిన వెంటనే, కాన్ఫిగర్ చేసిన WhatsApp గ్రూప్ కి షేర్ చేయడానికి పరికరం (OS) షేర్ షీట్ ని తెరుస్తుంది.
  // గమనిక: WhatsApp/ఏ ప్లాట్‌ఫారమైనా, భద్రత కారణాల వల్ల ఏ వెబ్‌సైట్ కూడా టैप్ లేకుండా నేరుగా గ్రూప్ కి మెసేజ్ పంపడానికి అనుమతించదు —
  // కాబట్టి ఇది షేర్ షీట్ ని ఆటోమేటిక్‌గా తెరిచి, గ్రూప్ ని ఎంచుకుని ఒక్క టैప్ తో పంపేలా సిద్ధం చేస్తుంది.
  const shareToWhatsappGroup = async (post) => {
    if (!autoShareWhatsapp || !whatsappLink) return;
    const { text, link } = buildShareMessage(post);

    // ఫోటో/వీడియో ఇంకా లోకల్ డేటా-URL గా ఉంటే (Drive అప్‌లోడ్ కాకముందే), దాన్ని ఫైల్‌గా జతచేసి పంపే ప్రయత్నం —
    // దీనివల్ల WhatsApp చాట్‌లో నిజమైన థంబ్‌నెయిల్ కనిపిస్తుంది. నెట్‌వర్క్ లింక్‌లతో ఆలస్యం వల్ల షేర్ అనుమతి పోకుండా ఉండేందుకు దీన్ని data: URL లకే పరిమితం చేశాం.
    if (post.image && post.image.startsWith("data:") && navigator.canShare && navigator.share) {
      try {
        const blob = await (await fetch(post.image)).blob();
        const ext = post.type === "video" ? "mp4" : "jpg";
        const file = new File([blob], `post-${post.id}.${ext}`, { type: blob.type || (post.type === "video" ? "video/mp4" : "image/jpeg") });
        if (navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: TEMPLE_NAME_LINE1, text });
          return;
        }
      } catch (err) { /* మీడియా ఫైల్‌గా షేర్ కుదరకపోతే కింద టెక్స్ట్+లింక్ షేర్‌కి వెళ్తాం */ }
    }

    if (navigator.share) {
      try { await navigator.share({ title: TEMPLE_NAME_LINE1, text, url: link }); } catch (err) { /* యూజర్ షేర్ షీట్ ని రద్దు చేసుకుంటే ఇక్కడితో ఆగిపోతుంది */ }
      return;
    }
    // Share API లేని బ్రౌజర్లకు (ఉదా: డెస్క్‌టాప్) ఫాల్‌బ్యాక్ — WhatsApp వెబ్/యాప్ ఫార్వర్డ్ స్క్రీన్ తెరుస్తుంది, అక్కడ గ్రూప్ ఎంచుకుని పంపొచ్చు
    window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, "_blank");
  };

  const handleShare = (post) => {
    const text = post.blogLink ? `${post.content}\n\nమరిన్ని వివరాలు: ${post.blogLink}` : post.content;
    if (navigator.share) {
      navigator.share({ title: TEMPLE_NAME_LINE1, text, url: post.blogLink || window.location.href });
    } else {
      navigator.clipboard?.writeText(text);
      alert("పోస్ట్ కాపీ అయింది!");
    }
    const updated = posts.map(p => p.id === post.id ? { ...p, shares: (p.shares || 0) + 1 } : p);
    setPosts(updated);
    syncToShared(updated);
  };

  // "ఈరోజు పోస్టర్" ని షేర్ చేయడానికి — ఫోటో డేటా-URL అయితే ఫైల్‌గా జతచేసి పంపే ప్రయత్నం చేస్తుంది, లేకపోతే లింక్/టెక్స్ట్ షేర్ చేస్తుంది
  const handleSharePoster = async (poster) => {
    const text = `🛕 ${TEMPLE_NAME_LINE1}\n📅 ఈరోజు పోస్టర్ - ${formatDate(poster.date)}`;
    if (poster.url && poster.url.startsWith("data:") && navigator.canShare && navigator.share) {
      try {
        const blob = await (await fetch(poster.url)).blob();
        const file = new File([blob], `poster-${poster.id}.jpg`, { type: blob.type || "image/jpeg" });
        if (navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: TEMPLE_NAME_LINE1, text });
          return;
        }
      } catch (err) { /* ఫైల్‌గా షేర్ కుదరకపోతే కింద ఫాల్‌బ్యాక్‌కి వెళ్తాం */ }
    }
    if (navigator.share) {
      try { await navigator.share({ title: TEMPLE_NAME_LINE1, text, url: poster.url }); } catch (err) { /* యూజర్ రద్దు చేసుకుంటే ఇక్కడితో ఆగిపోతుంది */ }
      return;
    }
    navigator.clipboard?.writeText(text);
    alert("పోస్టర్ వివరాలు కాపీ అయ్యాయి!");
  };

  const uploadToDrive = async (dataUrl, filename) => {
    if (!driveWebAppUrl) return null;
    try {
      const res = await fetch(driveWebAppUrl, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ filename, dataUrl }),
      });
      const json = await res.json();
      return (json && json.ok) ? json : null;
    } catch (err) {
      return null;
    }
  };

  // Drive లింక్ నిజంగా బ్రౌజర్‌లో లోడ్ అవుతుందో లేదో సరిచూసే హెల్పర్.
  // (Drive అప్‌లోడ్ అయిన వెంటనే కొన్నిసార్లు లింక్ కొన్ని క్షణాలు యాక్టివ్ కాదు — దీనివల్ల ఫీడ్‌లో ఫోటో ఖాళీగా కనిపించే సమస్య రాకుండా ఇది ఆపుతుంది.)
  const preloadImageOnce = (url, timeoutMs) => new Promise(resolve => {
    let done = false;
    const finish = (ok) => { if (!done) { done = true; resolve(ok); } };
    const img = new Image();
    img.onload = () => finish(true);
    img.onerror = () => finish(false);
    img.src = url;
    setTimeout(() => finish(false), timeoutMs);
  });
  const verifyImageUrl = async (url, attempts = 3, delayMs = 1300) => {
    for (let i = 0; i < attempts; i++) {
      if (await preloadImageOnce(url, 8000)) return true;
      if (i < attempts - 1) await new Promise(r => setTimeout(r, delayMs));
    }
    return false;
  };

  const handleImageFile = (file) => {
    if (!file) return;
    const mediaType = file.type.startsWith("video") ? "video" : "image";
    const reader = new FileReader();
    reader.onload = (e) => {
      const dataUrl = e.target.result;
      setNewPost(prev => ({ ...prev, imageBase64: dataUrl, imagePreview: dataUrl, mediaType, uploading: !!driveWebAppUrl }));
      if (driveWebAppUrl) {
        // Drive అప్‌లోడ్ Promise ని ref లో దాచుకుంటున్నాం — పోస్ట్ వెంటనే చేసినా, ఈ Promise పూర్తయ్యాక ఫీడ్‌లోని పోస్ట్ ఆటోమేటిక్‌గా అప్డేట్ అవుతుంది.
        const uploadPromise = uploadToDrive(dataUrl, file.name).then(async result => {
          const candidateUrl = result ? (mediaType === "video" ? result.previewUrl : (result.directUrl || result.previewUrl)) : null;
          let finalUrl = dataUrl; // డిఫాల్ట్‌గా లోకల్ ఫోటోనే వాడతాం — ఎప్పటికీ ఖాళీగా కనిపించకుండా
          if (candidateUrl) {
            if (mediaType === "video") {
              finalUrl = candidateUrl; // వీడియోలను నేరుగా నమ్ముతాం
            } else {
              const ok = await verifyImageUrl(candidateUrl);
              finalUrl = ok ? candidateUrl : dataUrl;
            }
          }
          setNewPost(prev => (prev.imagePreview === dataUrl ? { ...prev, imageBase64: finalUrl, uploading: false } : prev));
          return finalUrl;
        });
        uploadPromiseRef.current = uploadPromise;
      } else {
        uploadPromiseRef.current = null;
      }
    };
    reader.readAsDataURL(file);
  };

  const ITEM_SETTERS = { event: setEvents, gallery: setGallery, donor: setDonors, info: setInfoItems, donation: setDonationItems, poster: setPosters };
  const ITEM_DEFAULTS = {
    event: { title: "", desc: "", date: new Date().toISOString().slice(0, 10), icon: "🛕" },
    gallery: { url: "", base64: "", folder: "నిర్మాణ ఫోటోలు", mediaType: "image" },
    donor: { name: "", wifeName: "", childrenNames: "", relation: "", village: "", area: "", details: "", icon: "🏡", photo: "" },
    info: { icon: "📅", title: "", value: "" },
    donation: { icon: "📱", title: "", value: "", desc: "" },
    whatsapp: { link: "" },
    poster: { url: "", base64: "", date: getTodayStr() },
  };
  const TYPE_TO_CATEGORY = { event: "events", gallery: "gallery", donor: "info", info: "info", donation: "donations", whatsapp: "info", poster: "poster" };

  const openAddItem = (type) => {
    if (!hasPerm(TYPE_TO_CATEGORY[type], "add")) return;
    setItemModal({ type, mode: "add", id: null, form: { ...ITEM_DEFAULTS[type] } });
  };
  const openEditItem = (type, item) => {
    if (!hasPerm(TYPE_TO_CATEGORY[type], "edit")) return;
    setItemModal({ type, mode: "edit", id: item.id, form: { ...item } });
  };
  const closeItemModal = () => setItemModal(null);

  const saveItemModal = () => {
    if (!itemModal) return;
    const { type, mode, id, form } = itemModal;
    if (!hasPerm(TYPE_TO_CATEGORY[type], mode === "add" ? "add" : "edit")) { closeItemModal(); return; }
    if (form.uploading || form.uploadingPhoto) { alert("అప్‌లోడ్ పూర్తయ్యే వరకూ వేచి ఉండండి..."); return; }
    if (type === "whatsapp") {
      if (!form.link?.trim()) { alert("గ్రూప్ లింక్ నమోదు చేయండి"); return; }
      setWhatsappLink(form.link.trim());
      closeItemModal();
      return;
    }
    if (type === "event" && (!form.title?.trim() || !form.date)) { alert("శీర్షిక మరియు తేదీ నమోదు చేయండి"); return; }
    if (type === "gallery" && !form.base64 && !form.url?.trim()) { alert("ఫోటో ఎంచుకోండి లేదా URL నమోదు చేయండి"); return; }
    if (type === "donor" && !form.name?.trim()) { alert("పేరు నమోదు చేయండి"); return; }
    if ((type === "info" || type === "donation") && !form.title?.trim()) { alert("శీర్షిక నమోదు చేయండి"); return; }
    if (type === "poster" && !form.base64 && !form.url?.trim()) { alert("పోస్టర్ ఫోటో ఎంచుకోండి లేదా URL నమోదు చేయండి"); return; }
    if (type === "poster" && !form.date) { alert("పోస్టర్ కనిపించాల్సిన తేదీ ఎంచుకోండి"); return; }

    const setter = ITEM_SETTERS[type];
    setter(prev => {
      if (mode === "add") {
        const newItem = type === "gallery"
          ? { id: makeId(), url: form.base64 || form.url, type: form.mediaType || "image", folder: (form.folder || "నిర్మాణ ఫోటోలు").trim() }
          : type === "poster"
          ? { id: makeId(), url: form.base64 || form.url, date: form.date, postedByName: currentUser?.name || (isMainAdmin ? "మెయిన్ అడ్మిన్" : "అడ్మిన్"), postedByPhoto: currentUser?.photo || "" }
          : { ...form, id: makeId() };
        return [newItem, ...prev];
      } else {
        return prev.map(it => {
          if (it.id !== id) return it;
          if (type === "gallery") return { ...it, url: form.base64 || form.url || it.url, type: form.mediaType || it.type || "image", folder: (form.folder || it.folder || "నిర్మాణ ఫోటోలు").trim() };
          if (type === "poster") return { ...it, url: form.base64 || form.url || it.url, date: form.date || it.date };
          return { ...it, ...form };
        });
      }
    });
    closeItemModal();
  };

  const deleteContentItem = (type, id) => {
    if (!hasPerm(TYPE_TO_CATEGORY[type], "delete")) return;
    if (!window.confirm("దీన్ని తొలగించాలా?")) return;
    if (type === "whatsapp") { setWhatsappLink(""); return; }
    ITEM_SETTERS[type](prev => prev.filter(it => it.id !== id));
  };

  const handleItemImageFile = (file) => {
    if (!file || !itemModal) return;
    const mediaType = file.type.startsWith("video") ? "video" : "image";
    const reader = new FileReader();
    reader.onload = (e) => {
      const dataUrl = e.target.result;
      setItemModal(m => m && ({ ...m, form: { ...m.form, base64: dataUrl, mediaType, uploading: !!driveWebAppUrl } }));
      if (driveWebAppUrl) {
        uploadToDrive(dataUrl, file.name).then(async result => {
          const candidateUrl = result ? (mediaType === "video" ? result.previewUrl : (result.directUrl || result.previewUrl)) : null;
          let finalUrl = dataUrl;
          if (candidateUrl) {
            if (mediaType === "video") finalUrl = candidateUrl;
            else finalUrl = (await verifyImageUrl(candidateUrl)) ? candidateUrl : dataUrl;
          }
          setItemModal(m => (m && m.form.base64 === dataUrl) ? { ...m, form: { ...m.form, base64: finalUrl, uploading: false } } : m);
        });
      }
    };
    reader.readAsDataURL(file);
  };

  // స్థల దాత యొక్క చిన్న రౌండ్ ఫోటో అప్‌లోడ్ చేయడానికి (ఐచ్ఛికం)
  const handleDonorPhotoFile = (file) => {
    if (!file || !itemModal) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const dataUrl = e.target.result;
      setItemModal(m => m && ({ ...m, form: { ...m.form, photo: dataUrl, uploadingPhoto: !!driveWebAppUrl } }));
      if (driveWebAppUrl) {
        uploadToDrive(dataUrl, file.name).then(async result => {
          const candidateUrl = result ? (result.directUrl || result.previewUrl) : null;
          const finalUrl = candidateUrl ? ((await verifyImageUrl(candidateUrl)) ? candidateUrl : dataUrl) : dataUrl;
          setItemModal(m => (m && m.form.photo === dataUrl) ? { ...m, form: { ...m.form, photo: finalUrl, uploadingPhoto: false } } : m);
        });
      }
    };
    reader.readAsDataURL(file);
  };

  const handleSaveDriveUrl = () => {
    const url = driveSettingsInput.trim();
    setDriveMsg(url ? "✅ Google Drive లింక్ సేవ్ అయింది!" : "🗑️ తీసివేయబడింది.");
    setDriveWebAppUrl(url);
    setTimeout(() => setDriveMsg(""), 3500);
  };

  const handleSaveSheetUrl = () => {
    const url = sheetSettingsInput.trim();
    setSheetMsg(url ? "✅ Google Sheet లింక్ సేవ్ అయింది!" : "🗑️ తీసివేయబడింది.");
    setSheetWebAppUrl(url);
    setTimeout(() => setSheetMsg(""), 3500);
  };

  const handleSaveFirebaseConfig = () => {
    const text = firebaseConfigInput.trim();
    setFirebaseConfigText(text);
    setFirebaseMsg(text ? "✅ Firebase config సేవ్ అయింది!" : "🗑️ తీసివేయబడింది.");
    setTimeout(() => setFirebaseMsg(""), 3500);
  };

  const [newSubAdminPhone, setNewSubAdminPhone] = useState("");
  const [newSubAdminName, setNewSubAdminName] = useState("");
  const [newSubAdminPwd, setNewSubAdminPwd] = useState("");
  const [newSubAdminPerms, setNewSubAdminPerms] = useState(() => emptyPerms());
  const [adminMsg, setAdminMsg] = useState("");
  const [expandedAdminPhone, setExpandedAdminPhone] = useState(null);
  const [editPerms, setEditPerms] = useState(null);

  const togglePerm = (setter, catKey, action) => setter(p => ({ ...p, [catKey]: { ...p[catKey], [action]: !p[catKey][action] } }));

  const handleAddSubAdmin = () => {
    if (!/^\d{10}$/.test(newSubAdminPhone)) { setAdminMsg("సరైన ఫోన్ నెంబర్ నమోదు చేయండి"); return; }
    if (subAdmins.find(a => a.phone === newSubAdminPhone)) { setAdminMsg("ఈ నెంబర్ ఇప్పటికే ఉంది"); return; }
    setSubAdmins([...subAdmins, { phone: newSubAdminPhone, name: newSubAdminName, password: newSubAdminPwd, permissions: newSubAdminPerms }]);
    setUsers(users.map(u => u.phone === newSubAdminPhone ? { ...u, role: "sub_admin", permissions: newSubAdminPerms } : u));
    setNewSubAdminPhone(""); setNewSubAdminName(""); setNewSubAdminPwd(""); setNewSubAdminPerms(emptyPerms());
    setAdminMsg("అడ్మిన్ విజయవంతంగా జోడించబడ్డారు!");
    setTimeout(() => setAdminMsg(""), 2500);
  };

  const handleRemoveSubAdmin = (phone) => {
    setSubAdmins(subAdmins.filter(a => a.phone !== phone));
    setUsers(users.map(u => u.phone === phone ? { ...u, role: "user", permissions: undefined } : u));
    if (expandedAdminPhone === phone) { setExpandedAdminPhone(null); setEditPerms(null); }
  };

  const handleUpdateSubAdminPerms = (phone, perms) => {
    setSubAdmins(subAdmins.map(a => a.phone === phone ? { ...a, permissions: perms } : a));
    setUsers(users.map(u => u.phone === phone ? { ...u, permissions: perms } : u));
    setExpandedAdminPhone(null); setEditPerms(null);
  };

  const tabs = [
    { id: "feed", label: "ఫీడ్", icon: "📰" },
    { id: "events", label: "కార్యక్రమాలు", icon: "📅" },
    { id: "info", label: "గుడి info", icon: "ℹ️" },

function PostCard({ post, onLike, onShare, onComment, commentInput, setCommentInput, onEdit, onDelete, highlighted }) {
  const [showComments, setShowComments] = useState(false);
  const commentsList = Array.isArray(post.comments) ? post.comments : [];

  return (
    <div id={"post-" + post.id} style={{ background: "rgba(0,0,0,0.25)", border: highlighted ? "2px solid #f39c12" : "1px solid rgba(232,128,10,0.25)", boxShadow: highlighted ? "0 0 18px rgba(243,156,18,0.55)" : "none", borderRadius: 16, overflow: "hidden", marginBottom: 16, transition: "box-shadow 0.4s, border 0.4s" }}>
      <div style={{ padding: "12px 14px", display: "flex", alignItems: "center", gap: 10 }}>
        <div style={{ width: 38, height: 38, background: "rgba(232,128,10,0.3)", borderRadius: 19, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18 }}>{post.avatar}</div>

          <div style={{ fontSize: 13, fontWeight: 700, color: "#fff" }}>{post.author}</div>
          <div style={{ fontSize: 10, color: "rgba(255,255,255,0.45)" }}>{new Date(post.date).toLocaleDateString("te-IN", { day: "numeric", month: "long", year: "numeric" })}</div>
        </div>
        {onEdit && <button onClick={onEdit} style={{ background: "rgba(232,128,10,0.2)", border: "none", borderRadius: 8, padding: "5px 10px", color: "#f39c12", fontSize: 12, cursor: "pointer", marginRight: 6 }}>✏️</button>}
        {onDelete && <button onClick={onDelete} style={{ background: "rgba(220,50,50,0.2)", border: "none", borderRadius: 8, padding: "5px 10px", color: "#ff8080", fontSize: 12, cursor: "pointer" }}>🗑️</button>}
      </div>
      {post.image && (
  <div style={{ width: "100%", height: 300, overflow: "hidden", borderRadius: 8, marginTop: 8, background: "#000", position: "relative" }}>
    {post.uploading && (
      <div style={{ position: "absolute", inset: 0, zIndex: 2, background: "rgba(0,0,0,0.45)", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 8 }}>
        <div style={{ width: 34, height: 34, border: "3px solid rgba(255,255,255,0.25)", borderTopColor: "#f39c12", borderRadius: "50%", animation: "vtspin 0.8s linear infinite" }} />
        <div style={{ fontSize: 11, color: "#fff", fontWeight: 600 }}>అప్‌లోడ్ అవుతోంది...</div>
      </div>
    )}
    {post.type === "video" ? (
      <video src={post.image} controls style={{ width: "100%", height: "100%", objectFit: "cover", display: "block" }} />
    ) : (
      <img 
        src={
          post.image.includes("drive.google.com") && post.image.includes("/view")
            ? post.image.replace("/view?usp=drivesdk", "/preview").replace("/view", "/preview")
            : post.image
        } 
        alt="Post media" 
        style={{ width: "100%", height: "100%", objectFit: "cover", display: "block" }} 
        onError={(e) => {
          const img = e.target;
          const isDataUrl = (post.image || "").startsWith("data:");
          const tries = Number(img.dataset.retryCount || 0);
          if (!isDataUrl && tries < 3) {
            img.dataset.retryCount = String(tries + 1);
            const base = (post.image || "").split("&_r=")[0];
            setTimeout(() => { img.src = base + (base.includes("?") ? "&" : "?") + "_r=" + Date.now(); }, 1500);
          } else {
            console.error("Image load error:", post.image);
            img.style.display = 'none'; // ఇమేజ్ లింక్ నిజంగా విరిగిపోతేనే లేఅవుట్ పాడవకుండా దాస్తుంది
          }
        }}
      />
    )}
  </div>
)}
      <div style={{ padding: "12px 14px 8px", fontSize: 13, color: "rgba(255,255,255,0.85)", lineHeight: 1.7 }}>{post.content}</div>
      {post.blogLink && <div style={{ padding: "4px 14px 10px" }}><a href={post.blogLink} target="_blank" rel="noreferrer" style={{ color: "#f39c12", fontSize: 12, fontWeight: 600, textDecoration: "underline" }}>📖 బ్లాగ్ చదవండి →</a></div>}
      <div style={{ padding: "8px 14px 12px", display: "flex", gap: 8, borderTop: "1px solid rgba(255,255,255,0.06)" }}>
        <ABt icon={post.liked ? "❤️" : "🤍"} label={`${post.likes || 0}`} onClick={onLike} active={post.liked} />
        <ABt icon="💬" label={`${commentsList.length}`} onClick={() => setShowComments(!showComments)} />
        <ABt icon="📤" label={post.shares ? `షేర్ (${post.shares})` : "షేర్"} onClick={onShare} />
      </div>
      {showComments && (
        <div style={{ padding: "0 14px 14px", borderTop: "1px solid rgba(255,255,255,0.05)" }}>
          {commentsList.map((c, i) => (
            <div key={i} style={{ background: "rgba(255,255,255,0.05)", borderRadius: 10, padding: "8px 12px", marginBottom: 6, marginTop: 8 }}>
              <span style={{ fontSize: 11, fontWeight: 700, color: "#e8800a" }}>{c.user}: </span>
              <span style={{ fontSize: 12, color: "rgba(255,255,255,0.8)" }}>{c.text}</span>
            </div>
          ))}
          <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
            <input type="text" placeholder="కామెంట్ రాయండి..." value={commentInput} onChange={e => setCommentInput(e.target.value)} onKeyDown={e => { if (e.key === "Enter") onComment(commentInput); }}
              style={{ flex: 1, padding: "9px 12px", background: "rgba(255,255,255,0.07)", border: "1px solid rgba(232,128,10,0.3)", borderRadius: 10, color: "#fff", fontSize: 12, outline: "none" }} />
            <button onClick={() => onComment(commentInput)} style={{ background: "#e8800a", border: "none", borderRadius: 10, padding: "0 14px", color: "#fff", fontSize: 14, cursor: "pointer" }}>➤</button>
          </div>
        </div>
      )}
    </div>
  );
}

function ABt({ icon, label, onClick, active }) {
  return (
    <button onClick={onClick} style={{ background: active ? "rgba(232,128,10,0.2)" : "rgba(255,255,255,0.06)", border: `1px solid ${active ? "rgba(232,128,10,0.5)" : "rgba(255,255,255,0.1)"}`, borderRadius: 8, padding: "7px 12px", color: active ? "#e8800a" : "rgba(255,255,255,0.7)", fontSize: 12, fontWeight: 600, cursor: "pointer", display: "flex", alignItems: "center", gap: 5 }}>
      <span>{icon}</span><span>{label}</span>
    </button>
  );
}

const iSt = { width: "100%", padding: "12px 14px", background: "rgba(255,255,255,0.08)", border: "1px solid rgba(232,128,10,0.4)", borderRadius: 10, color: "#fff", fontSize: 13, marginBottom: 12, boxSizing: "border-box", outline: "none" };

// Render safely
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
