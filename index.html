// ====== LOCAL STORAGE HELPERS ======
function lsGet(key, def) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch { return def; }
}
function lsSet(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
}

  donations: "vt_public_donations",
  whatsapp: "vt_public_whatsapp",
};
async function sharedGet(key) {
  try {
    const res = await window.storage.get(key, true);
    return res ? JSON.parse(res.value) : null;
  } catch { return null; }
}
async function sharedSet(key, val) {
  try { await window.storage.set(key, JSON.stringify(val), true); } catch {}
}

// ====== FIREBASE FALLBACK (used only outside Claude — e.g. the installed APK/website,
// where window.storage doesn't exist) — gives real-time sync visible to everyone. ======
function fbAvailable() {
  return typeof window !== "undefined" && !!window.__fbDb;
}
async function fbGet(key) {
  try {
    const snap = await window.__fbDb.ref(key).once("value");
    return snap.exists() ? snap.val() : null;
  } catch { return null; }
}
async function fbSet(key, val) {
  try { await window.__fbDb.ref(key).set(val); } catch {}
}
function fbListen(key, cb) {
  if (!fbAvailable()) return () => {};
  const ref = window.__fbDb.ref(key);
  const handler = (snap) => cb(snap.exists() ? snap.val() : null);
  ref.on("value", handler);
  return () => ref.off("value", handler);
}

// Unified cloud read/write: prefers Claude's window.storage, falls back to Firebase
async function cloudGet(key) {
  if (typeof window !== "undefined" && window.storage) return sharedGet(key);
  if (fbAvailable()) return fbGet(key);
  return null;
}
async function cloudSet(key, val) {
  if (typeof window !== "undefined" && window.storage) return sharedSet(key, val);
  if (fbAvailable()) return fbSet(key, val);
}

    const isDesignated = subAdmins.find(a => a.phone === authForm.phone);

    const newUser = { name: authForm.name, phone: authForm.phone, password: authForm.password, role, permissions: isDesignated ? isDesignated.permissions : undefined };

    setCurrentUser(newUser);
    setScreen("main");
    setAuthForm({ name: "", phone: "", password: "" });
  };

  const handleLogin = () => {
    setAuthError("");
    const foundMain = MAIN_ADMINS.find(a => a.id === authForm.phone && a.pwd === authForm.password);
    if (foundMain) {
      const u = { name: "మెయిన్ అడ్మిన్", phone: foundMain.id, role: "main_admin" };
      setCurrentUser(u); setScreen("main"); return;
    }
    const found = users.find(u => u.phone === authForm.phone && u.password === authForm.password);
    if (found) {
      const isDesignated = subAdmins.find(a => a.phone === found.phone);
      setCurrentUser({ ...found, role: isDesignated ? "sub_admin" : found.role, permissions: isDesignated ? isDesignated.permissions : found.permissions });
      setScreen("main");
      setAuthForm({ name: "", phone: "", password: "" });
    } else {
      setAuthError("ఫోన్ నెంబర్ లేదా పాస్వర్డ్ సరికాదు");

  };

  const handleLogout = () => {
    setCurrentUser(null); lsSet("vt_user", null);
    setScreen("auth"); setAuthMode("login"); setMenuOpen(false);
  };

  // ====== POSTS ======
  const syncToShared = async (updatedPosts) => {
    setSyncStatus("సింక్ అవుతోంది...");
    await cloudSet(STORAGE_KEYS.posts, updatedPosts);
    setSyncStatus("✅ అందరికీ కనిపించేలా సింక్ అయింది!");
    setTimeout(() => setSyncStatus(""), 2500);
  };

  const handleLike = (id) => {
    const updated = posts.map(p =>
      p.id === id ? { ...p, liked: !p.liked, likes: p.liked ? p.likes - 1 : p.likes + 1 } : p
    );
    setPosts(updated);
    syncToShared(updated);
  };

  const handleDeletePost = (id) => {
    if (!hasPerm("feed", "delete")) return;
    if (window.confirm("ఈ పోస్ట్ ను తొలగించాలా?")) {
      const updated = posts.filter(p => p.id !== id);
      setPosts(updated);
      syncToShared(updated);
    }
  };

  const handleAddPost = async () => {
    if (!newPost.content.trim()) return;
    if (newPost.uploading) { alert("ఫోటో/వీడియో Google Drive కి అప్‌లోడ్ అవుతోంది, కొద్ది క్షణాలు వేచి ఉండండి..."); return; }
    if (editingPostId && !hasPerm("feed", "edit")) return;
    if (!editingPostId && !hasPerm("feed", "add")) return;
    let updated;
    if (editingPostId) {
      updated = posts.map(p => p.id === editingPostId
        ? { ...p, content: newPost.content, image: newPost.imageBase64 || p.image, type: newPost.imageBase64 ? (newPost.mediaType || "image") : p.type }
        : p);
    } else {
      const p = {
        id: Date.now(),
        author: currentUser?.name || "అతిథి",
        avatar: isMainAdmin ? "👑" : isSubAdmin ? "✍️" : "👤",
        date: new Date().toISOString().slice(0, 10),
        type: newPost.imageBase64 ? (newPost.mediaType || "image") : "text",
        content: newPost.content,
        image: newPost.imageBase64 || null,
        likes: 0,
        comments: [],
        liked: false,
        blogLink: null
      };
      updated = [p, ...posts];
    }
    setPosts(updated);
    setNewPost({ content: "", imageBase64: "", imagePreview: "", mediaType: "", uploading: false });
    setEditingPostId(null);
    setPostModal(false);
    // Sync to shared storage → blog sees it instantly
    await syncToShared(updated);
  };

  const handleEditPost = (post) => {
    setEditingPostId(post.id);
    setNewPost({ content: post.content, imageBase64: "", imagePreview: post.image || "", mediaType: post.type === "video" ? "video" : "image", uploading: false });
    setPostModal(true);
  };

  const handleShare = (post) => {
    const text = post.blogLink ? `${post.content}\n\nమరిన్ని వివరాలు: ${post.blogLink}` : post.content;
    if (navigator.share) {
      navigator.share({ title: TEMPLE_NAME_LINE1, text, url: post.blogLink || window.location.href });
    } else {
      navigator.clipboard?.writeText(text);
      alert("పోస్ట్ కాపీ అయింది!");
    }
  };

  // ====== GOOGLE DRIVE UPLOAD (via Apps Script relay Web App) ======
  const uploadToDrive = async (dataUrl, filename) => {
    if (!driveWebAppUrl) return null;
    try {
      const res = await fetch(driveWebAppUrl, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" }, // avoids CORS preflight on Apps Script
        body: JSON.stringify({ filename, dataUrl }),
      });
      const json = await res.json();
      if (json && json.ok) return json;
      return null;
    } catch (err) {
      console.error("Drive upload failed:", err);
      return null;
    }
  };

  const handleImageFile = (file) => {
    if (!file) return;
    const mediaType = file.type.startsWith("video") ? "video" : "image";
    const reader = new FileReader();
    reader.onload = async (e) => {
      const dataUrl = e.target.result;
      setNewPost(prev => ({ ...prev, imageBase64: dataUrl, imagePreview: dataUrl, mediaType, uploading: !!driveWebAppUrl }));
      if (driveWebAppUrl) {
        const result = await uploadToDrive(dataUrl, file.name);
        if (result) {
          const finalUrl = mediaType === "video" ? result.previewUrl : (result.directUrl || result.previewUrl);
          setNewPost(prev => ({ ...prev, imageBase64: finalUrl, uploading: false }));
        } else {
          setNewPost(prev => ({ ...prev, uploading: false }));
          alert("Google Drive కి అప్‌లోడ్ విఫలమైంది — ఫోటో/వీడియో ఈ పరికరంలోనే సేవ్ అవుతుంది.");
        }
      }
    };
    reader.readAsDataURL(file);
  };

  // ====== GENERIC CONTENT CRUD (main admin: events, gallery, donors, info, donations) ======

  const ITEM_DEFAULTS = {
    event: { title: "", desc: "", date: new Date().toISOString().slice(0, 10), icon: "🛕" },
    gallery: { url: "", base64: "" },
    donor: { name: "", relation: "", village: "", area: "", details: "", icon: "🏡" },

    donation: { icon: "📱", title: "", value: "", desc: "" },

  const saveItemModal = () => {

    if (form.uploading) { alert("అప్‌లోడ్ పూర్తయ్యే వరకూ వేచి ఉండండి..."); return; }
    if (type === "whatsapp") {
      if (!form.link?.trim()) { alert("గ్రూప్ లింక్ నమోదు చేయండి"); return; }
      setWhatsappLink(form.link.trim());
      closeItemModal();
      return;
    }
    if (type === "event" && (!form.title?.trim() || !form.date)) { alert("శీర్షిక మరియు తేదీ నమోదు చేయండి"); return; }
    if (type === "gallery" && !form.base64 && !form.url?.trim()) { alert("ఫోటో ఎంచుకోండి లేదా URL నమోదు చేయండి"); return; }
    if ((type === "donor") && !form.name?.trim()) { alert("పేరు నమోదు చేయండి"); return; }

    const setter = ITEM_SETTERS[type];
    setter(prev => {
      if (mode === "add") {
        const newItem = type === "gallery"
          ? { id: makeId(), url: form.base64 || form.url }
          : { ...form, id: makeId() };
        return [newItem, ...prev];

        return prev.map(it => {
          if (it.id !== id) return it;
          if (type === "gallery") return { ...it, url: form.base64 || form.url || it.url };
          return { ...it, ...form };
        });
      }
    });
    closeItemModal();
  };

  const deleteContentItem = (type, id) => {

    const result = await uploadToDrive(testDataUrl, "connection-test.txt");
    setDriveMsg(result ? "✅ కనెక్షన్ విజయవంతం! Drive ఫోల్డర్‌లో టెస్ట్ ఫైల్ చూడండి." : "❌ కనెక్షన్ విఫలమైంది. Web App URL మరియు డిప్లాయ్‌మెంట్ సెట్టింగ్స్ (Anyone can access) సరిచూడండి.");
    setTimeout(() => setDriveMsg(""), 5000);
  };

  const handleSaveFirebaseConfig = () => {
    const text = firebaseConfigInput.trim();
    if (text) {
      try { new Function("return (" + text + ")")(); } catch { setFirebaseMsg("⚠️ ఈ కోడ్ సరైన Firebase config లా లేదు. మళ్ళీ కాపీ చేసి చూడండి."); setTimeout(() => setFirebaseMsg(""), 4000); return; }
    }
    setFirebaseConfigText(text);
    setFirebaseMsg(text ? "✅ Firebase config సేవ్ అయింది!" : "🗑️ Firebase config తీసివేయబడింది.");
    setTimeout(() => setFirebaseMsg(""), 3500);
  };

  const handleTestFirebaseConfig = async () => {
    if (typeof window === "undefined" || !window.firebase) { setFirebaseMsg("ℹ️ ఇది Claude Artifact లో పనిచేయదు — ఇన్‌స్టాల్ చేసిన APK/వెబ్‌సైట్ లో మాత్రమే పరీక్షించండి."); setTimeout(() => setFirebaseMsg(""), 5000); return; }
    if (!firebaseReady) { setFirebaseMsg("❌ కనెక్ట్ కాలేదు. Config సరిచూసి, 'సేవ్ చేయి' నొక్కారా చూడండి."); setTimeout(() => setFirebaseMsg(""), 4000); return; }
    setFirebaseMsg("⏳ పరీక్షిస్తోంది...");
    await cloudSet("vt_public_connection_test", { at: Date.now() });
    const back = await cloudGet("vt_public_connection_test");
    setFirebaseMsg(back ? "✅ కనెక్షన్ విజయవంతం! నిజ-సమయ సింక్ సిద్ధం." : "❌ కనెక్షన్ విఫలమైంది. Realtime Database rules & config సరిచూడండి.");
    setTimeout(() => setFirebaseMsg(""), 5000);
  };

  // ====== ADMIN ======
  const [newSubAdminPhone, setNewSubAdminPhone] = useState("");
  const [newSubAdminName, setNewSubAdminName] = useState("");
  const [newSubAdminPwd, setNewSubAdminPwd] = useState("");
  const [newSubAdminPerms, setNewSubAdminPerms] = useState(() => emptyPerms());
  const [adminMsg, setAdminMsg] = useState("");
  const [expandedAdminPhone, setExpandedAdminPhone] = useState(null);
  const [editPerms, setEditPerms] = useState(null);

  const togglePerm = (setter, catKey, action) => setter(p => ({ ...p, [catKey]: { ...p[catKey], [action]: !p[catKey][action] } }));

  const handleAddSubAdmin = () => {
    if (!/^\d{10}$/.test(newSubAdminPhone)) { setAdminMsg("సరైన ఫోన్ నెంబర్ నమోదు చేయండి"); return; }
    if (subAdmins.find(a => a.phone === newSubAdminPhone)) { setAdminMsg("ఈ నెంబర్ ఇప్పటికే అడ్మిన్ గా ఉంది"); return; }
    setSubAdmins([...subAdmins, { phone: newSubAdminPhone, name: newSubAdminName, password: newSubAdminPwd, permissions: newSubAdminPerms }]);
    setUsers(users.map(u => u.phone === newSubAdminPhone ? { ...u, role: "sub_admin", permissions: newSubAdminPerms } : u));
    setNewSubAdminPhone(""); setNewSubAdminName(""); setNewSubAdminPwd(""); setNewSubAdminPerms(emptyPerms());
    setAdminMsg("అడ్మిన్ విజయవంతంగా జోడించబడ్డారు!");
    setTimeout(() => setAdminMsg(""), 2500);
  };

  const handleRemoveSubAdmin = (phone) => {
    setSubAdmins(subAdmins.filter(a => a.phone !== phone));
    setUsers(users.map(u => u.phone === phone ? { ...u, role: "user", permissions: undefined } : u));
    if (expandedAdminPhone === phone) { setExpandedAdminPhone(null); setEditPerms(null); }
  };

  const handleUpdateSubAdminPerms = (phone, perms) => {
    setSubAdmins(subAdmins.map(a => a.phone === phone ? { ...a, permissions: perms } : a));
    setUsers(users.map(u => u.phone === phone ? { ...u, permissions: perms } : u));
    setExpandedAdminPhone(null); setEditPerms(null);
  };

  const tabs = [
    { id: "feed", label: "ఫీడ్", icon: "📰" },
    { id: "events", label: "కార్యక్రమాలు", icon: "📅" },
    { id: "info", label: "గుడి info", icon: "ℹ️" },
    { id: "gallery", label: "మీడియా", icon: "🖼️" },
    { id: "donations", label: "విరాళాలు", icon: "💛" },
  ];

  // ====== AUTH SCREEN ======
  if (screen === "auth") {
    return (
      <div style={{ minHeight: "100vh", background: "linear-gradient(135deg, #c0392b 0%, #e67e22 40%, #c0392b 100%)", fontFamily: "'Noto Sans Telugu', 'Segoe UI', sans-serif", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 20, maxWidth: 480, margin: "0 auto" }}>
        <div style={{ fontSize: 60, marginBottom: 8, textAlign: "center" }}>🕉️</div>
        <div style={{ fontSize: 18, fontWeight: 900, color: "#fff", textAlign: "center", lineHeight: 1.4, marginBottom: 4 }}>{TEMPLE_NAME_LINE1}</div>
        <div style={{ fontSize: 15, fontWeight: 700, color: "rgba(255,255,255,0.85)", textAlign: "center", marginBottom: 24 }}>{TEMPLE_NAME_LINE2}</div>

            {["register", "login"].map(m => (
              <button key={m} onClick={() => { setAuthMode(m); setAuthError(""); }}
                style={{ flex: 1, padding: "10px 0", background: authMode === m ? "linear-gradient(135deg, #c0392b, #e67e22)" : "none", border: "none", borderRadius: 10, color: "#fff", fontSize: 13, fontWeight: 700, cursor: "pointer" }}>
                {m === "register" ? "రిజిస్టర్" : "లాగిన్"}

          <input type={authMode === "login" ? "text" : "tel"} placeholder={authMode === "login" ? "ఫోన్ నెంబర్ లేదా User ID" : "ఫోన్ నెంబర్ (10 అంకెలు)"} value={authForm.phone} onChange={e => setAuthForm({ ...authForm, phone: e.target.value })} style={iSt} />
          <input type="password" placeholder={authMode === "register" ? "పాస్వర్డ్ (4-8 అక్షరాలు)" : "పాస్వర్డ్"} value={authForm.password} onChange={e => setAuthForm({ ...authForm, password: e.target.value })} style={{ ...iSt, marginBottom: 0 }} />
          {authError && <div style={{ color: "#ffcdd2", fontSize: 12, marginTop: 10, textAlign: "center" }}>{authError}</div>}
          <button onClick={authMode === "register" ? handleRegister : handleLogin}
            style={{ width: "100%", marginTop: 16, padding: "14px", background: "linear-gradient(135deg, #c0392b, #e67e22)", border: "none", borderRadius: 12, color: "#fff", fontSize: 15, fontWeight: 800, cursor: "pointer" }}>
            {authMode === "register" ? "🙏 నమోదు చేయండి" : "🔐 లాగిన్ అవ్వండి"}
          </button>
        </div>
      </div>
    );
  }

  // ====== MAIN APP ======
  return (

      {/* Sync status toast */}
      {syncStatus && (
        <div style={{ position: "fixed", top: 12, left: "50%", transform: "translateX(-50%)", background: "#1a1a1a", color: "#fff", fontSize: 12, padding: "8px 16px", borderRadius: 20, zIndex: 9999, border: "1px solid rgba(255,255,255,0.2)" }}>

        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <span style={{ fontSize: 26 }}>🕉️</span>
            <div>
              <div style={{ fontSize: 12, fontWeight: 900, color: "#fff", letterSpacing: 0.3, lineHeight: 1.3 }}>{TEMPLE_NAME_LINE1}</div>
              <div style={{ fontSize: 11, fontWeight: 700, color: "rgba(255,255,255,0.9)", marginTop: 1 }}>{TEMPLE_NAME_LINE2}</div>
            </div>

                )}
                {newPost.uploading && (
                  <div style={{ position: "absolute", inset: 0, background: "rgba(0,0,0,0.6)", display: "flex", alignItems: "center", justifyContent: "center", borderRadius: 10, color: "#FFD700", fontSize: 12, fontWeight: 700 }}>☁️ Google Drive కి అప్‌లోడ్ అవుతోంది...</div>
                )}
                <button onClick={() => setNewPost({ ...newPost, imageBase64: "", imagePreview: "", mediaType: "", uploading: false })} style={{ position: "absolute", top: 8, right: 8, background: "rgba(0,0,0,0.7)", border: "none", borderRadius: "50%", width: 28, height: 28, color: "#fff", fontSize: 14, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}>✕</button>
              </div>
            )}
            {driveWebAppUrl && <div style={{ fontSize: 10, color: "rgba(255,255,255,0.4)", marginTop: 6 }}>☁️ ఫోటోలు/వీడియోలు మీ Google Drive కి సేవ్ అవుతాయి</div>}
            <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
              <button onClick={() => galleryInputRef.current?.click()} style={{ flex: 1, padding: "11px 8px", background: "rgba(255,255,255,0.08)", border: "1px solid rgba(232,128,10,0.35)", borderRadius: 10, color: "#fff", fontSize: 12, fontWeight: 600, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>🖼️ గ్యాలరీ / వీడియో</button>
              <button onClick={() => cameraInputRef.current?.click()} style={{ flex: 1, padding: "11px 8px", background: "rgba(255,255,255,0.08)", border: "1px solid rgba(232,128,10,0.35)", borderRadius: 10, color: "#fff", fontSize: 12, fontWeight: 600, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>📷 కెమెరా</button>
            </div>
            <div style={{ display: "flex", gap: 10, marginTop: 14 }}>
              <button onClick={() => { setPostModal(false); setEditingPostId(null); setNewPost({ content: "", imageBase64: "", imagePreview: "", mediaType: "", uploading: false }); }} style={{ flex: 1, padding: "12px", background: "rgba(255,255,255,0.08)", border: "1px solid rgba(255,255,255,0.15)", borderRadius: 10, color: "#fff", fontSize: 13, fontWeight: 700, cursor: "pointer" }}>రద్దు</button>
              <button onClick={handleAddPost} disabled={newPost.uploading} style={{ flex: 2, padding: "12px", background: newPost.uploading ? "rgba(255,255,255,0.15)" : "linear-gradient(135deg, #c0392b, #e67e22)", border: "none", borderRadius: 10, color: "#fff", fontSize: 13, fontWeight: 700, cursor: newPost.uploading ? "not-allowed" : "pointer" }}>{editingPostId ? "✅ మార్పులు సేవ్ చేయి" : "📤 పోస్ట్ చేయి → అందరికీ కనిపిస్తుంది"}</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function PostCard({ post, onLike, onShare, onComment, commentInput, setCommentInput, onEdit, onDelete }) {
  const [showComments, setShowComments] = useState(false);
  return (
    <div style={{ background: "rgba(0,0,0,0.25)", border: "1px solid rgba(232,128,10,0.25)", borderRadius: 16, overflow: "hidden", marginBottom: 16 }}>
      <div style={{ padding: "12px 14px", display: "flex", alignItems: "center", gap: 10 }}>
        <div style={{ width: 38, height: 38, background: "rgba(232,128,10,0.3)", borderRadius: 19, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18 }}>{post.avatar}</div>
        <div style={{ flex: 1 }}>
          <div style={{ fontSize: 13, fontWeight: 700, color: "#fff" }}>{post.author}</div>
          <div style={{ fontSize: 10, color: "rgba(255,255,255,0.45)" }}>{new Date(post.date).toLocaleDateString("te-IN", { day: "numeric", month: "long", year: "numeric" })}</div>
        </div>
        {onEdit && <button onClick={onEdit} style={{ background: "rgba(232,128,10,0.2)", border: "none", borderRadius: 8, padding: "5px 10px", color: "#f39c12", fontSize: 12, cursor: "pointer", marginRight: 6 }}>✏️</button>}
        {onDelete && <button onClick={onDelete} style={{ background: "rgba(220,50,50,0.2)", border: "none", borderRadius: 8, padding: "5px 10px", color: "#ff8080", fontSize: 12, cursor: "pointer" }}>🗑️</button>}
      </div>
      {post.image && <div style={{ width: "100%", maxHeight: 300, overflow: "hidden" }}><img src={post.image} alt="" style={{ width: "100%", objectFit: "cover", display: "block" }} /></div>}
      <div style={{ padding: "12px 14px 8px", fontSize: 13, color: "rgba(255,255,255,0.85)", lineHeight: 1.7 }}>{post.content}</div>
      {post.blogLink && <div style={{ padding: "4px 14px 10px" }}><a href={post.blogLink} target="_blank" rel="noreferrer" style={{ color: "#f39c12", fontSize: 12, fontWeight: 600, textDecoration: "underline" }}>📖 బ్లాగ్ చదవండి →</a></div>}
      <div style={{ padding: "8px 14px 12px", display: "flex", gap: 8, borderTop: "1px solid rgba(255,255,255,0.06)" }}>
        <ABt icon={post.liked ? "❤️" : "🤍"} label={`${post.likes}`} onClick={onLike} active={post.liked} />
        <ABt icon="💬" label={`${post.comments.length}`} onClick={() => setShowComments(!showComments)} />
        <ABt icon="📤" label="షేర్" onClick={onShare} />
      </div>
      {showComments && (
        <div style={{ padding: "0 14px 14px", borderTop: "1px solid rgba(255,255,255,0.05)" }}>
          {post.comments.map((c, i) => (
            <div key={i} style={{ background: "rgba(255,255,255,0.05)", borderRadius: 10, padding: "8px 12px", marginBottom: 6, marginTop: 8 }}>
              <span style={{ fontSize: 11, fontWeight: 700, color: "#e8800a" }}>{c.user}: </span>
              <span style={{ fontSize: 12, color: "rgba(255,255,255,0.8)" }}>{c.text}</span>
            </div>
          ))}
          <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
            <input type="text" placeholder="కామెంట్ రాయండి..." value={commentInput} onChange={e => setCommentInput(e.target.value)} onKeyDown={e => { if (e.key === "Enter") onComment(commentInput); }}
              style={{ flex: 1, padding: "9px 12px", background: "rgba(255,255,255,0.07)", border: "1px solid rgba(232,128,10,0.3)", borderRadius: 10, color: "#fff", fontSize: 12, outline: "none" }} />
            <button onClick={() => onComment(commentInput)} style={{ background: "#e8800a", border: "none", borderRadius: 10, padding: "0 14px", color: "#fff", fontSize: 14, cursor: "pointer" }}>➤</button>
          </div>
        </div>
      )}
    </div>
  );
}

function ABt({ icon, label, onClick, active }) {
  return (
    <button onClick={onClick} style={{ background: active ? "rgba(232,128,10,0.2)" : "rgba(255,255,255,0.06)", border: `1px solid ${active ? "rgba(232,128,10,0.5)" : "rgba(255,255,255,0.1)"}`, borderRadius: 8, padding: "7px 12px", color: active ? "#e8800a" : "rgba(255,255,255,0.7)", fontSize: 12, fontWeight: 600, cursor: "pointer", display: "flex", alignItems: "center", gap: 5 }}>
      <span>{icon}</span><span>{label}</span>
    </button>
  );
}

const iSt = { width: "100%", padding: "12px 14px", background: "rgba(255,255,255,0.08)", border: "1px solid rgba(232,128,10,0.4)", borderRadius: 10, color: "#fff", fontSize: 13, marginBottom: 12, boxSizing: "border-box", outline: "none" };

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
